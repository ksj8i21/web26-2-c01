<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Basic</title>

</head>
    <script>
        window.onload = function(){
            let button = document.getElementById("button");
            button.onclick = function(){
                alert("버튼 클릭");
            };
        };
    </script>

<body>
    <button id="button">버튼</button>
  

    <hr>
    <h2>04이벤트</h2>
    <ol>
        <li><b>이벤트 연결</b>
            <ul>
                <li><b>1</b>1인라인 이벤트 모델(문서 객체에 이벤트를 연결하는 방식) 사용하기</li>
                <li><b>2</b>script태그에 인라인 이벤트 모델 사용하기</li>
                <li><b>3</b>고전 이벤트 모델</li>
            </ul>
        </li>
        <li>이벤트 사용</li>
    </ol>

</body>

</html>
