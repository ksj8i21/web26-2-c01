<head>
    <meta charset="UTF-8">

    <title>3. CSS3 Units</title>

    <style>
        p:nth-child(1) {}

        p:nth-child(2) {
            font-size: 1.5em;
        }

        p:nth-child(3) {
            font-size: 2em;
        }

        p:nth-child(4) {
            font-size: 3em;
        }

        p:nth-child(5) {
            font-size: 4em;
        }

        p:nth-child(1) {}

        p:nth-child(2) {
            font-size: 16px;
        }

        p:nth-child(3) {
            font-size: 24px;
        }

        p:nth-child(4) {
            font-size: 32px;
        }

        p:nth-child(5) {
            font-size: 64px;
        }

        h1 {
            background-color: #d1ff2c72;
        }

        h2 {
            background-color: #ff2c2c72;
        }

        h3 {
            background-color: #2cff8f72;
        }
    </style>
</head>
