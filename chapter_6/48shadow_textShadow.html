<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>7.그림자와 그레이디언트 속성</title>
    <style>
        p {
            text-shadow: 2px 2px 5px #ff0000;
            text-align: center;
            font-size: 50px;
            border: 10px solid #e70202;
            border-radius: 20px;
            box-shadow: 10px 10px 5px #888888;

        }

        .box {
            width: 1400px;
            height: 200px;
            background-color: #ffffff00;
            box-shadow: 10px 10px 5px #888888;
            text-align: center;

        }
    </style>

</head>

<body>
    <h2>7.7. 그림자와 그레이디언트 속성</h2>
    <h3>1. text-shadow 속성</h3>
    <h3>2. box-shadow 속성</h3>

    <hr>
    <p>이 문장은 그림자가 있습니다.</p>
    <div class="box">
        <h1>이 요소는 그림자가 있습니다.</h1>
    </div>

    <hr>
    <div class="gradient">
        <h1>CSS3 그레이디언트</h1>
    </div>
</body>

</html>
